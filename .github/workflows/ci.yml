name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          OIDC_ENABLED: "false"
          SESSION_SECRET_KEY: "test-secret-key-for-ci-only"
        run: |
          .venv/bin/pytest tests/ -v --tb=short

      - name: Run type check
        run: |
          .venv/bin/mypy app/ --ignore-missing-imports

      - name: Run lint
        run: |
          .venv/bin/ruff check app/

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Run lint
        run: npm run lint

  backend-docker:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: prism-lab-backend:test
          load: true

  frontend-docker:
    name: Build Frontend Docker
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: prism-lab-frontend:test
          load: true

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-docker, frontend-docker]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d
          # Wait for services to be healthy
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend healthy"
              break
            fi
            sleep 2
          done

      - name: Test health endpoint
        run: |
          curl -sf http://127.0.0.1:8000/health | jq -e '.status == "healthy"'

      - name: Test OIDC disabled flow
        run: |
          # Test that API rejects unauthenticated requests when OIDC disabled
          curl -sf http://127.0.0.1:8000/api/jobs -w "%{http_code}" -o /dev/null | grep -E "401|403"

      - name: Cleanup
        if: always()
        run: docker compose down -v